<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
  <rect width="1000" height="500" rx="22" fill="#0b1220"/>
  <text x="500" y="48" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#ffffff">DevSecOps Checks for Infrastructure as Code</text>
  <text x="500" y="76" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#a9c1dd">Shift-left security • example control points</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="45" y="130" width="200" height="105" rx="12" fill="#17345a" stroke="#60a5fa" stroke-width="2"/><text x="145" y="165" font-size="18" font-weight="700" fill="#fff">Source</text><text x="145" y="191" font-size="14" fill="#c5d9ef">Git diff / PR</text><text x="145" y="213" font-size="14" fill="#c5d9ef">review</text>
    <rect x="280" y="130" width="200" height="105" rx="12" fill="#17345a" stroke="#60a5fa" stroke-width="2"/><text x="380" y="165" font-size="18" font-weight="700" fill="#fff">Quality</text><text x="380" y="191" font-size="14" fill="#c5d9ef">fmt • validate</text><text x="380" y="213" font-size="14" fill="#c5d9ef">TFLint</text>
    <rect x="515" y="130" width="200" height="105" rx="12" fill="#4b3516" stroke="#fbbf24" stroke-width="2"/><text x="615" y="165" font-size="18" font-weight="700" fill="#fff">Security</text><text x="615" y="191" font-size="14" fill="#fce7b2">Checkov • Semgrep</text><text x="615" y="213" font-size="14" fill="#fce7b2">policy checks</text>
    <rect x="750" y="130" width="200" height="105" rx="12" fill="#4b3516" stroke="#fbbf24" stroke-width="2"/><text x="850" y="165" font-size="18" font-weight="700" fill="#fff">Secrets</text><text x="850" y="191" font-size="14" fill="#fce7b2">Gitleaks</text><text x="850" y="213" font-size="14" fill="#fce7b2">credential detection</text>
    <path d="M245 182 H278 M480 182 H513 M715 182 H748" stroke="#8bc5ff" stroke-width="3"/><path d="M270 174 L280 182 L270 190 M505 174 L515 182 L505 190 M740 174 L750 182 L740 190" fill="none" stroke="#8bc5ff" stroke-width="3"/>
    <rect x="190" y="300" width="620" height="92" rx="12" fill="#123a36" stroke="#22c55e" stroke-width="2"/><text x="500" y="335" font-size="18" font-weight="700" fill="#fff">Policy Decision</text><text x="500" y="361" font-size="14" fill="#c8f7dc">Triage findings • fail on defined blockers • publish reports</text><text x="500" y="381" font-size="14" fill="#c8f7dc">Fix issues before plan / approval / deployment</text>
    <path d="M850 235 V270 H500 V298" stroke="#8bc5ff" stroke-width="3" fill="none"/><path d="M492 289 L500 300 L508 289" fill="none" stroke="#8bc5ff" stroke-width="3"/>
